spring:
  application:
    name: claims-agent-team
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/claims_agent_team}
    username: ${DATABASE_USERNAME:claims_agent}
    password: ${DATABASE_PASSWORD:claims_agent}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}
