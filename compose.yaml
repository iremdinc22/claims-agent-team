services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claims_agent_team
      POSTGRES_USER: claims_agent
      POSTGRES_PASSWORD: claims_agent
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_agent -d claims_agent_team"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
